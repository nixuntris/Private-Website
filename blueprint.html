<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-blue: #001133;
            --grid-color: rgba(0, 255, 255, 0.1);
            --blueprint-line: #00ffff;
            --text-white: #e0f7fa;
            --accent-yellow: #fff000;
            --dim-text: rgba(224, 247, 250, 0.6);
        }

        body {
            background-color: var(--bg-blue);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-white);
            font-family: 'Space Mono', monospace;
            margin: 0;
            padding: 2rem;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid var(--blueprint-line);
            padding: 2rem;
            background: rgba(0, 17, 51, 0.9);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        header {
            border-bottom: 2px double var(--blueprint-line);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
        }

        .back-link {
            color: var(--accent-yellow);
            text-decoration: none;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            border: 1px solid var(--accent-yellow);
            padding: 0 5px;
        }

        h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; color: var(--blueprint-line); }
        .meta-data { font-size: 0.7rem; color: var(--dim-text); margin-top: 0.5rem; }

        .post-content { line-height: 1.6; font-size: 0.9rem; }
        .post-content p { margin-bottom: 1.5rem; }
        
        .technical-specs {
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid var(--accent-yellow);
            padding: 1rem;
            margin: 1.5rem 0;
            font-size: 0.8rem;
        }

        .image-block {
            border: 1px solid var(--blueprint-line);
            margin: 2rem 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        .image-block img, .image-block video {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: cyan(100%); /* Optional: adds to blueprint feel */
        }

        .caption {
            font-size: 0.7rem;
            margin-top: 12px;
            color: var(--accent-yellow);
            display: block;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 4rem;
            font-size: 0.6rem;
            text-align: center;
            border-top: 1px solid var(--grid-color);
            padding-top: 1.5rem;
            color: var(--dim-text);
        }

        b { color: var(--accent-yellow); }
    </style>
</head>
