    <script>
        const projectLogs = {
            'voxel': {
                title: "Graphics: Custom Voxel Software Rasterizer",
                content: `
                    <p>
                        This is the very first breakdown of my custom voxel rendering pipeline. Because the architecture involves a lot of moving parts, I'm breaking it up into smaller pieces. This segment focuses strictly on the core renderer, leaving the meshing, compression algorithms, physics, shadows for future posts. 
                    </p>
                    <p>
                        The technique was originally inspired by virtualized geometry systems (think Unreal Engine's Nanite), but it has since diverged into something closer to point map rendering or point splatting.
                    </p>

                    <hr>

                    <h3>Why Abandon Hardware Rasterization?</h3>
                    <p>
                        In graphics programming, it is well known that hardware rasterization (<strong>HWRast</strong>) faces major efficiency bottlenecks when dealing with ultra-dense, sub-pixel geometry.
                    </p>
                    <ul>
                        <li><strong>The Problem:</strong> GPUs natively process pixels in 2x2 quads to calculate texture derivatives. If a triangle is so small that it only covers one pixel, the hardware still has to process all four pixels in that quad and throw three of them away.</li>
                        <li><strong>The Alternative:</strong> Moving to a software rasterizer (<strong>SWRast</strong>) built on compute shaders frees the pipeline from these fixed hardware execution blocks. This flexibility is exactly why Nanite excels at microscopic geometric detail.</li>
                    </ul>
                    <p>
                        Furthermore, because I am rendering voxels rather than traditional triangle meshes, I can generate geometry on demand from a single point. Each voxel only needs to store its position, material type, and face visibility—requiring far less data than 12 explicit triangles. While this is technically possible using standard hardware pipelines, managing it within a custom SWRast pipeline is vastly simpler.
                    </p>

                    <h3>Data Structure and Memory Layout</h3>
                    <p>
                        <em>(Note: In this context, a "mesh" simply refers to a grouped list of voxel points, not a traditional index/vertex buffer).</em>
                    </p>
                    <p>
                        To keep the memory footprint microscopic, I split each mesh into "meshlets" of 64 localized points and apply a tight compression pass:
                    </p>
                    <ul>
                        <li><strong>Position Packing:</strong> I calculate the bounding box for the 64-point group and subtract the center position from each point. This leaves relative coordinate values ranging strictly between 0 and 1024. By allocating 10 bits per axis, an entire (x, y, z) position packs neatly into a single <code>uint32_t</code>.</li>
                        <li><strong>Metadata & Palette:</strong> For voxel attributes, I use palette compression. Each voxel stores a <code>uint16_t</code> material ID, allowing for 65,536 distinct colors—plenty of overhead for my needs.</li>
                        <li><strong>Face Visibility:</strong> Visible faces are tracked via a simple 6-bit bitmask, where each bit represents a face direction (Front, Back, Left, Right, Top, Bottom).</li>
                    </ul>

                    <h3>Culling and Rasterization</h3>
                    <p>
                        Detection and exclusion happen hierarchically at the meshlet level before any pixels are filled:
                    </p>
                    <ol>
                        <li><strong>Frustum Culling:</strong> Eliminates meshlets entirely outside the camera's field of view.</li>
                        <li><strong>Occlusion Culling (Hi-Z):</strong> Checks the remaining meshlets against a Hierarchical Z-Buffer to see if they are hidden behind closer geometry.</li>
                    </ol>
                    <p>
                        If a meshlet passes both checks, it is pushed to a global visibility buffer. During the final software rasterization step, the compute shader references a <strong>Look-Up Table (LUT)</strong> containing positional offsets for each face. This allows the shader to generate exact vertex positions on the fly and perform traditional triangle rendering with the generated data.
                    </p>

                    <h4>Optimizations & Specifics</h4>
                    <ul>
                        <li><strong>Fill Rate:</strong> I utilize checkerboard rendering paired with temporal reprojection to halve the number of raw pixels filled each frame.</li>
                        <li><strong>Normals:</strong> To save memory, surface normals are not stored; they are calculated analytically at runtime.</li>
                    </ul>

                    <h3>Procedural Elements: Grass</h3>
                    <p>
                        Static geometry isn't the only thing the runtime handles; foliage utilizes a highly parallelized variant of this system.
                    </p>
                    <p>
                        Instead of generating static voxels, I write a dedicated compute shader for each foliage type using custom, L-System-style procedural rules to generate grass blades on demand. These are rendered using simple billboard quads, using trigonometry functions within the shader to simulate realistic wind swaying.
                    </p>

                    <div class="note-box">
                        <p><em><strong>Note:</strong> This is still a work in progress. I eventually want to factor in the underlying terrain slope and sun direction to dictate how the foliage organically grows, but I haven't had the time to implement it yet.</em></p>
                    </div>

                    <h3>Memory Management</h3>
                    <p>
                        Originally, the asset pipeline processed geometry in a single, monolithic pass: combining all data into one massive mesh before generating meshlets. However, even the smallest block update required massive CPU recalculations.
                    </p>
                    <p>
                        To solve this, I transitioned to a sparse, chunk-based management system:
                    </p>
                    <ul>
                        <li>Each world chunk handles its own mesh and cached geometry data independently.</li>
                        <li>Upon a chunk update, <code>PreGenerateGPUData</code> is called to build and compress the data locally.</li>
                        <li>During <code>UpdateGPUGeometry</code>, the engine allocates a Shader Storage Buffer Object (SSBO) with appropriate padding and uploads the compressed chunk data to the GPU.</li>
                        <li>On subsequent frames, the manager simply verifies whether the total allocated pool memory has been exceeded. If it has, it destroys the original SSBO, allocates a larger memory block, and re-binds the resources.</li>
                    </ul>

                    <div class="image-block">
                        <img src="showcase/enginerasterizer.png" alt="Rasterizer Interface">
                        <video controls autoplay muted loop>
                            <source src="showcase/physicsrasterizervid.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <hr>

                    <h3>Project Update: Dynamic Editing </h3>
                    <p>
                        
                    </p>

                        <p style="font-size: 0.85rem; opacity: 0.8; margin-bottom: 1.5rem;">
                        </p>
                        <a href="?id=voxel-phase2" class="back-link" style="margin-bottom: 0; padding: 10px 20px; border: 2px solid var(--text-color); background: var(--accent-color); color: #2D2F54; border-radius: 4px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;">
                            Read Dynamic Editing &gt;&gt;
                        </a>
                `
            },
            'voxel-phase2' : {
                title: "Dynamic Editing",
                content: `
                    <p>
                        In this breakdown, I will detail how the pipeline dynamically updates mesh data while circumventing the performance bottlenecks inherently associated with virtualized geometry updates. 
                    </p>
                    <p>
                        Because the engine is built on OpenGL, allowing asynchronous memory updates during the primary render pass would introduce an unsustainable memory tax to store multiple geometry states. Instead, the system splits geometry modifications into two distinct pipelines: a static terrain system driven by precalculated decals, and a dynamic, fluid simulation pipeline utilizing a GPU-driven brickmap structure.
                    </p>

                    <hr>

                    <h3>Static Geometry Modification: Pre-Meshed Decals</h3>
                    <p>
                        To alter static terrain without triggering costly, real-time CPU or GPU re-meshing routines across entire chunks, the engine utilizes a decentralized decal system.
                    </p>
                    <ul>
                        <li><strong>The Approach:</strong> Common geometric modifications—such as a 5^3 volumetric cluster of grass—are pre-calculated and cached as isolated mesh assets.</li>
                        <li><strong>The Execution:</strong> When a structural edit occurs, the underlying chunk data is updated logically, but the visual geometry is appended via localized instanced draw calls matching the decal's transform. This keeps terrain edits cheap and avoids destructive buffer allocations.</li>
                    </ul>

                    <h3>Dynamic Simulation: GPU Brickmap Architecture</h3>
                    <p>
                        For the <em>Sandspiel</em> (falling-sand style fluid and granular physics) portion of the engine, static caching is impossible.
                    </p>
                    <p>
                        Instead of managing a traditional CPU-side sparse voxel octree, the voxel data is stored entirely on the GPU utilizing a flat <strong>brickmap</strong> structure. In this architecture, individual world chunks function directly as the primary data nodes rather than being subdivided by parent nodes. 
                    </p>

                    <div class="note-box">
                        <p><em><strong>Implementation Detail:</strong> Volumetric voxel data within each node is stored and accessed using bindless textures. </em></p>
                    </div>

                    <h3>Meshless Rasterization & Batching Pipeline</h3>
                    <p>
                        Rather than generating complex, tightly packed meshlet structures for the simulation data, the compute shader skips the meshlet creation pass entirely. It performs raw face culling directly on individual voxels in parallel:
                    </p>
                    <ol>
                        <li><strong>Coarse Frustum Culling:</strong> Visibility evaluation is scaled out, tracking and discarding geometry strictly at a macro 64^3 volume boundaries.</li>
                        <li><strong>Multi-Chunk Batching:</strong> To minimize state changes, multiple simulation chunks are combined into a single, unified draw call per fluid type.</li>
                    </ol>
                    <p>
                        The shader achieves this by receiving two compact arrays via uniform buffers:
                    </p>
                    <ul>
                        <li><code>vec3 chunk_positions[16]</code> — Tracking individual world-space offsets for up to 16 active simulation nodes.</li>
                        <li><code>uvec2 image_handles[16]</code> — Storing the corresponding bindless image data handles for each volumetric node.</li>
                    </ul>
                    <p>
                        During the software rasterization stage, local voxel positions are offset on the fly using these arrays, matching the exact rasterization pass. It is a streamlined, highly performant solution to real-time volumetric updates—inspired heavily by Gabe Rundlett's work on gvox.
                        It's used to simulate falling as well, since I pass along neighbouring chunks. (In a different pass).
                    </p>

                    <div class="image-block">
                        <img src="showcase/CA.png" alt="Rasterizer Interface">
                    </div>
                    <div class="note-box">
                        <p><em><strong>Note:</strong> This is still a work in progress. I want to implement dirty chunks in the future and better batching for physics simulation. I am skimping over it since it's not a very novel or complex implementantion. </em></p>
                    </div>

                    <hr>
                `
            },
            'raytracer': {
                title: "Graphics: CPU Voxel Ray Tracing",
                content: `
                    <p>
                        Over the summer I've been working on a few small side projects as part of a hackathon. One of those projects is a CPU-based voxel ray tracer, which I started mostly as a playground for experimenting with rendering and optimization techniques.
                    </p>
                    <p>
                        Part of the motivation was simply curiosity: I wanted to see how far I could push my Ryzen 9 5950X on a workload that is realistically much better suited to a GPU. This isn't intended to be a CPU vs GPU argument; it's just a fun experiment in making something progressively less slow.
                    </p>

                    <hr>

                    <h3>Hierarchical Distance Fields</h3>
                    <p>
                        The first implementation was a simple ray marcher. Instead of advancing through every individual voxel, I stored conservative distance information for 32<sup>3</sup> regions. If the current region is known to be empty, the ray can safely jump forward rather than checking everything in between.
                    </p>
                    <p>
                        A single coarse level works well in large empty spaces, but becomes much less useful close to geometry. I therefore added progressively finer 16<sup>3</sup>, 8<sup>3</sup> and 4<sup>3</sup> layers. During traversal I query the applicable levels and use the largest safe step.
                    </p>
                    <div class="note-box">
                        <p><em><strong>Important:</strong> The distance values must remain conservative. Underestimating a distance only costs performance; overestimating it can make a ray skip geometry entirely.</em></p>
                    </div>

                    <h3>Multithreading</h3>
                    <p>
                        Primary rays are largely independent, so the first CPU-side parallelization was deliberately simple. I used OpenMP over the image with <code>#pragma omp parallel for collapse(2)</code>, allowing the combined X/Y iteration space to be distributed between worker threads.
                    </p>
                    <p>
                        It isn't sophisticated scheduling, but it was essentially free CPU utilization and gave me a useful baseline before worrying about lower-level optimization.
                    </p>

                    <h3>Checkerboard Rendering and Reprojection</h3>
                    <p>
                        Making each ray cheaper is useful, but another option is to simply trace fewer rays. I alternate between the two halves of a checkerboard pattern using <code>(x + y + frame) % 2</code>, meaning each pixel only needs a completely new primary ray every second frame.
                    </p>
                    <p>
                        Keeping the untouched pixels in their old screen positions breaks down when the camera moves, so the other half of the image is temporally reused through reprojection. This keeps the ray tracer at full output resolution while reducing how often each pixel requires a fresh traversal.
                    </p>

                    <h3>A Failed Low-Resolution Pass</h3>
                    <div class="image-block">
                        <img src="showcase/broken.webp" alt="Broken Low Resolution Pass">
                        <span class="caption">Broken Low Res</span>
                    </div>
                    <p>
                        One of my first traversal optimizations was a low-resolution pass. The idea was to trace a small number of coarse rays and use them to give the full-resolution rays a better starting distance.
                    </p>
                    <p>
                        The first implementation managed to be both slower and worse looking. It biased the image, produced visible pixelation, and I later found that it was accelerating the rays incorrectly. After trying to fix it for a while, I got annoyed and deleted the entire pass.
                    </p>
                    <p>
                        That ended up being useful, because it forced me to look more closely at the traversal itself.
                    </p>

                    <h3>Hierarchical DDA</h3>
                    <p>
                        The distance fields worked well whenever they could provide a useful jump, but the old fallback assumed the ray needed to advance by a very small amount. Failing to obtain a distance-field jump does not necessarily mean that the ray needs to move one voxel at a time; it may still be inside a known-empty 32<sup>3</sup>, 16<sup>3</sup>, 8<sup>3</sup> or 4<sup>3</sup> cell.
                    </p>
                    <p>
                        I therefore added a multi-level DDA fallback using the same hierarchy. The two traversal mechanisms have different jobs:
                    </p>
                    <ul>
                        <li><strong>Distance Field:</strong> Skip by a conservative known-safe distance.</li>
                        <li><strong>DDA:</strong> If that fails, move directly to the boundary of the largest usable empty cell.</li>
                    </ul>
                    <p>
                        This lets the spatial hierarchy remain useful even when the distance values themselves stop producing large steps.
                    </p>

                    <h3>Reworking the DDA Math</h3>
                    <p>
                        Conventional voxel DDA commonly stores a <code>tDelta</code> and accumulated <code>tMax</code> for each axis, then determines which axis boundary is crossed next. For this renderer I don't actually need to know which axis won; I only need the distance along the ray to the nearest boundary.
                    </p>
                    <p>
                        Because the hierarchy uses power-of-two cell sizes, I can cheaply align the current voxel coordinate to the origin of its cell:
                    </p>
                    <div class="note-box">
                        <code>
                            bx = ix &amp; ~(cellSize - 1);<br>
                            by = iy &amp; ~(cellSize - 1);<br>
                            bz = iz &amp; ~(cellSize - 1);
                        </code>
                    </div>
                    <p>
                        I calculate the reciprocal ray direction once, then use the sign of each component to select the appropriate cell face arithmetically. For X:
                    </p>
                    <div class="note-box">
                        <code>float ox = (sx + 1.0f) * 0.5f * cellSize;</code>
                    </div>
                    <p>
                        Since <code>sx</code> is either -1 or +1, <code>ox</code> becomes either zero or <code>cellSize</code>. The parametric distance to each candidate boundary is then:
                    </p>
                    <div class="note-box">
                        <code>
                            Tx = (bx + ox - px) * (1/dx)<br>
                            Ty = (by + oy - py) * (1/dy)<br>
                            Tz = (bz + oz - pz) * (1/dz)
                        </code>
                    </div>
                    <p>
                        The traversal step becomes <code>t += min(Tx, Ty, Tz) + epsilon</code>. Instead of explicitly selecting an axis and updating its DDA state, I advance the continuous ray parameter and reconstruct the position on the next iteration using <code>P(t) = origin + direction * t</code>.
                    </p>
                    <p>
                        The same calculation works for 1<sup>3</sup>, 4<sup>3</sup>, 8<sup>3</sup>, 16<sup>3</sup> and 32<sup>3</sup> cells simply by changing <code>cellSize</code>. The next-boundary calculation is also largely branchless with respect to ray direction and axis selection, making the arithmetic reasonably SIMD friendly.
                    </p>

                    <h3>The Low-Resolution Pass, Again</h3>
                    <div class="image-block">
                        <img src="showcase/firstlight.webp" alt="Working Full Resolution Rendering">
                        <span class="caption">Working Full Res</span>
                    </div>
                    <p>
                        After changing the underlying traversal I returned to the low-resolution pass. This time a coarse sample represents a group of full-resolution rays rather than pretending the entire block follows exactly the same direction.
                    </p>
                    <p>
                        I estimate the directional divergence across the block, effectively creating a cone which grows with distance. A step safe for the centre ray is not automatically safe for every ray represented by that cone, so I subtract the cone radius from the available empty-space distance before advancing.
                    </p>
                    <p>
                        The result is a conservative starting distance which can be shared with the full-resolution rays, allowing many of them to begin much closer to the first region where geometry can matter. The visual problem from the original implementation did not return; I never isolated its exact cause, so I'm not going to invent one.
                    </p>

                    <h3>Occupancy Masks</h3>
                    <p>
                        Once traversal became faster, accessing voxel data itself became relatively expensive. Most traversal queries only need to answer one question: <strong>is there a voxel here?</strong>
                    </p>
                    <p>
                        I therefore separated occupancy from the actual voxel data. Each voxel is represented by one bit, allowing 64 occupancy states to fit in a single 64-bit integer. If the bit is not set, the renderer never needs to touch the corresponding voxel payload.
                    </p>
                    <p>
                        Identical occupancy maps can also share the same underlying allocation instead of storing duplicate bitmaps. In my tests this change was roughly <strong>20% faster</strong> while being very cheap to compute.
                    </p>

                    <h3>AVX2 Ray Generation</h3>
                    <p>
                        After optimizing traversal, profiling exposed a slightly amusing bottleneck: generating the ray directions themselves.
                    </p>
                    <p>
                        I took the underlying screen-to-world ray maths from Raylib/Raymath, stripped it down for this renderer, and vectorized it with AVX2. Instead of generating one direction at a time, the renderer calculates eight X/Y/Z components together using eight-wide 32-bit floating-point vectors.
                    </p>
                    <p>
                        This was also a useful reminder that optimization is iterative: once one expensive stage becomes cheap enough, the bottleneck simply moves somewhere else.
                    </p>

                    <h3>Voxel LOD</h3>
                    <p>
                        I later added LOD to the voxel chunks themselves. Distant chunks do not need the same spatial resolution as nearby geometry, so increasingly large groups of voxels can be represented by a single value.
                    </p>
                    <p>
                        The traversal structures follow the same rule. If a chunk is already represented at LOD 16, generating 8<sup>3</sup> and 4<sup>3</sup> distance layers cannot improve its effective precision, so those layers are never generated. This saves preprocessing time and memory without reducing the quality actually represented by that LOD.
                    </p>

                    <h3>Cached Voxel Lighting</h3>
                    <div class="image-block">
                        <img src="showcase/test.webp" alt="First Shadow Rendering">
                        <span class="caption">First Shadows</span>
                    </div>
                    <p>
                        For lighting I decided to cache per-voxel RGB values. This makes high-performance lighting considerably easier, and I also prefer the resulting look.
                    </p>
                    <p>
                        Lighting uses an R8G8B8 representation. A value of zero represents uncalculated lighting, while the remaining byte range stores the quantized result. When a visible voxel has no cached lighting, I trace the required light or shadow ray and store the result. Later camera rays hitting the same voxel can simply read the cached RGB value instead of tracing another lighting ray.
                    </p>
                    <p>
                        This trades memory for less repeated traversal and makes lighting naturally demand-driven. Because three bytes per voxel still becomes expensive over a large world, I'm also working on allocating the lighting arrays only when a chunk first needs them.
                    </p>

                    <h3>Quantizing the Distance Fields</h3>
                    <p>
                        The distance hierarchy itself is another significant consumer of memory, particularly the finest 4<sup>3</sup> level. Fortunately, traversal does not require arbitrary numerical precision; it needs a conservative value describing how far the ray can safely move.
                    </p>
                    <p>
                        I therefore quantize the fine distance values. The important distinction is the direction of the error: a step that is too short only creates additional traversal work, while a step that is too long can skip geometry.
                    </p>
                    <p>
                        In typical chunks this reduced storage for the finest distance-field level by approximately <strong>8x</strong>. Besides reducing total memory use, this also reduces cache pressure on data which is accessed constantly during traversal.
                    </p>

                    <hr>

                    <div class="image-block">
                        <img src="showcase/full.webp" alt="Completed Lighting with Diffusion and Scattering">
                        <span class="caption">Completed Lighting with Diffusion and Scattering</span>
                    </div>

                    <h3>Where It Is Now</h3>
                    <p>
                        What started as a basic CPU ray marcher has gradually turned into a mixture of hierarchical traversal, temporal reuse, compressed acceleration data and CPU-specific optimization.
                    </p>
                    <p>
                        None of this is intended to make an argument that CPU ray tracing should replace the GPU. The interesting part of the project has been watching the bottleneck continuously move: make traversal faster and memory access becomes visible; reduce memory traffic and ray generation becomes expensive; vectorize that and something else becomes the next problem.
                    </p>

                    <h3>Future Work</h3>
                    <ul>
                        <li><strong>Per-Chunk Palette Compression:</strong> Store compact local palette indices instead of full voxel material IDs where possible.</li>
                        <li><strong>Incremental Chunk Generation:</strong> Spread distance-field, occupancy and LOD preprocessing across time instead of producing large stalls.</li>
                        <li><strong>AVX2 Traversal:</strong> Vectorize the traversal itself. The arithmetic maps well to SIMD; the difficult part is handling ray divergence and inactive lanes efficiently.</li>
                    </ul>

                    <article id="physics-pbd">
                        <p>
                            This is the very first iteration of my physics solver. I am open sourcing it because others may find it a useful learning resource. It utilizes a system similar to <strong>Position Based Dynamics (PBD)</strong> and impulse-based collision resolving. 
                        </p>

                        <p>
                            To keep things simple and readable for anyone following my logic, I've kept the project single-threaded, though it uses a few basic tricks to stay performant.
                        </p>

                        <hr>

                        <h3>Spatial Partitioning</h3>
                        <p>
                            In a naive physics engine, every object checks collisions with every other object. If you have 1,000 balls, that results in 1,000<sup>2</sup> (1,000,000) checks per frame. That's wasteful when you can implement a simple <strong>chunk-based partitioning system</strong>.
                        </p>
                        <ul>
                            <li><strong>The Concept:</strong> Define a grid size (e.g., 40x40 units).</li>
                            <li><strong>The Logic:</strong> Store object reference IDs in the specific chunk they occupy and recalculate this every frame.</li>
                            <li><strong>The Result:</strong> Objects only check for collisions within their own chunk and neighboring chunks. This drastically reduces the computational overhead.</li>
                        </ul>

                        <h3>Resolving Collisions</h3>
                        <p>
                            Detection is only half the battle; we still need to <strong>resolve</strong> the collisions by changing object velocity and position appropriately:
                        </p>
                        <ol>
                            <li><strong>Position Correction:</strong> We calculate the distance between objects and compare it to their combined radii. If they overlap, we force them apart by the overlap distance until they are just touching.</li>
                            <li><strong>Impulse Calculation:</strong> Once separated, we calculate the bounce. By determining the impact relative to the hit angle, we apply an impulse that modifies velocity so objects bounce away rather than sticking together or sliding through one another.</li>
                        </ol>

                        <h3>Constraints and Friction</h3>
                        <p>
                            The world boundaries are defined by the screen edges. When a ball hits a wall, I don't simply reverse the velocity; I <strong>dampen the factor by -0.2</strong>. This simulates energy loss, as no real-world object is perfectly bouncy. 
                        </p>
                        <p>
                            I also implemented a small <strong>"sleep" threshold</strong>: if the velocity drops below a certain level, it snaps to 0 to prevent visual jittering.
                        </p>

                        <div class="note-box">
                            <p><em><strong>Note:</strong> This is a foundational tool for understanding the basics. This version does not yet implement soft bodies, complex rigid bodies, or ropes/cloth. Unlike my current work in progress one. </em></p>
                        </div>
