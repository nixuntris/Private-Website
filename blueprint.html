<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixuntris // Blueprint Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;700&display=swap');

        :root {
            /* Formal Theme (Base) */
            --bg-color: #ffffff;
            --grid-line: transparent;
            --line-color: #1a1a1a;
            --text-color: #1a1a1a;
            --accent-color: #3366cc;
            --font-stack: 'Inter', system-ui, sans-serif;
            --container-bg: #ffffff;
            --border-style: 1px solid #dddddd;
        }

        /* Blueprint Theme (Toggle) */
        body.cyber-mode {
            --bg-color: #001133;
            --grid-line: rgba(0, 255, 255, 0.1);
            --line-color: #00ffff;
            --text-color: #e0f7fa;
            --accent-color: #fff000;
            --font-stack: 'Space Mono', monospace;
            --container-bg: rgba(0, 17, 51, 0.95);
            --border-style: 2px solid var(--line-color);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            font-family: var(--font-stack);
            margin: 0; padding: 2rem;
            transition: background 0.2s ease;
        }

        #theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            padding: 8px 16px; cursor: pointer;
            background: #000; color: #fff;
            font-family: var(--font-stack); font-weight: bold;
            border: 2px solid var(--text-color);
            border-radius: 4px;
        }
        body.cyber-mode #theme-toggle { 
            background: var(--line-color); 
            color: var(--bg-color); 
            border-radius: 0;
        }

        .container {
            max-width: 850px; margin: 0 auto;
            border: var(--border-style); padding: 2.5rem;
            background: var(--container-bg); position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 8px;
        }
        body.cyber-mode .container { 
            box-shadow: none; 
            border-radius: 0; 
        }

        header { border-bottom: 1px solid #dddddd; margin-bottom: 2rem; padding-bottom: 1.5rem; }
        body.cyber-mode header { border-bottom: 2px double var(--line-color); }

        .back-link { color: var(--accent-color); text-decoration: none; font-size: 0.8rem; display: inline-block; margin-bottom: 1rem; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--line-color); }

        .status-badge {
            display: inline-block; margin-top: 10px;
            border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 2px 8px; font-size: 0.7rem; font-weight: bold;
        }

        .post-content { line-height: 1.6; font-size: 0.9rem; }
        
        .technical-specs {
            background: #f9f9f9; border-left: 3px solid #000;
            padding: 1.2rem; margin: 1.5rem 0; font-size: 0.8rem;
        }
        body.cyber-mode .technical-specs { 
            background: rgba(0, 255, 255, 0.05); 
            border-left-color: var(--accent-color); 
        }

        /* Scaled Image & Video Container */
        .image-block { 
            border: var(--border-style); 
            margin: 2rem 0; 
            padding: 15px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* Forces media to stay within container and match widths */
        .image-block img, 
        .image-block video { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            display: block;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .caption { font-size: 0.7rem; margin-top: 12px; color: #888; display: block; }
        body.cyber-mode .caption { color: var(--accent-color); }

        footer { margin-top: 4rem; font-size: 0.65rem; text-align: center; opacity: 0.6; }
        b { color: var(--accent-color); }
    </style>
</head>
<body>

    <button id="theme-toggle">MODE: CYBER</button>

    <div class="container">
        <a href="index.html" class="back-link">&lt;&lt; Return to Index</a>
        <header>
            <h1 id="postTitle">Loading project...</h1>
            <div class="status-badge">Under Construction</div>
        </header>

        <article class="post-content" id="postBody"></article>

        <footer>
            Lixuntris // Reconstructed Engine Log // Core System Ver. 4.02 // 2026
        </footer>
    </div>

    <script>
        const projectLogs = {
            'voxel': {
                title: "Voxel Rasterizer Architecture",
                content: `
                    <p>This documentation is currently under construction. It details the implementation of a <b>Virtualized Geometry</b> pipeline. The code won't be open sourced because making it open source ready would take more time than I can give it while focusing on developing it. I wish to keep every open source repository maintained with high standard.</p>
                    <div class="image-block">
                        <img src="showcase/enginerasterizer.png" alt="Rasterizer Interface">
                        <video controls autoplay muted loop>
                            <source src="showcase/physicsrasterizervid.mp4" type="video/mp4">
                        </video>
                        <span class="caption">Technical View: Volumetric Render Streams</span>
                    </div>
                `
            },
            'path-tracer': {
                title: "Path Tracer Development",
                content: `
                    <p>Under construction. This section details compute ray tracing with global illumination. The code won't be open sourced because making it open source ready would take more time than I can give it while focusing on developing it. I wish to keep every open source repository maintained with high standard.</p>
                    <div class="image-block">
                        <img src="showcase/corenlsbox.png" alt="Cornell Box Evaluation">
                        <span class="caption">Simulation: Diffuse Rebound Analysis</span>
                    </div>
                `
            },
            'physics_pbd': {
                title: "Physics: Position Based Dynamics",
                content: `
                    <article id="physics-pbd">
    <h2>Physics: Position Based Dynamics</h2>

    <p>
        This is the very first iteration of my physics solver. I am open sourcing it because others may find it a useful learning resource. It utilizes a system similar to <strong>Position Based Dynamics (PBD)</strong> and impulse-based collision resolving. 
    </p>

    <p>
        To keep things simple and readable for anyone following my logic, I’ve kept the project single-threaded, though it uses a few basic tricks to stay performant.
    </p>

    <hr>

    <h3>Spatial Partitioning</h3>
    <p>
        In a naive physics engine, every object checks collisions with every other object. If you have 1,000 balls, that results in 1,000<sup>2</sup> (1,000,000) checks per frame. That’s wasteful when you can implement a simple <strong>chunk-based partitioning system</strong>.
    </p>
    <ul>
        <li><strong>The Concept:</strong> Define a grid size (e.g., 40x40 units).</li>
        <li><strong>The Logic:</strong> Store object reference IDs in the specific chunk they occupy and recalculate this every frame.</li>
        <li><strong>The Result:</strong> Objects only check for collisions within their own chunk and neighboring chunks. This drastically reduces the computational overhead.</li>
    </ul>

    <h3>Resolving Collisions</h3>
    <p>
        Detection is only half the battle; we still need to <strong>resolve</strong> the collisions by changing object velocity and position appropriately:
    </p>
    <ol>
        <li><strong>Position Correction:</strong> We calculate the distance between objects and compare it to their combined radii. If they overlap, we force them apart by the overlap distance until they are just touching.</li>
        <li><strong>Impulse Calculation:</strong> Once separated, we calculate the bounce. By determining the impact relative to the hit angle, we apply an impulse that modifies velocity so objects bounce away rather than sticking together or sliding through one another.</li>
    </ol>

    <h3>Constraints and Friction</h3>
    <p>
        The world boundaries are defined by the screen edges. When a ball hits a wall, I don’t simply reverse the velocity; I <strong>dampen the factor by -0.2</strong>. This simulates energy loss, as no real-world object is perfectly bouncy. 
    </p>
    <p>
        I also implemented a small <strong>"sleep" threshold</strong>: if the velocity drops below a certain level, it snaps to 0 to prevent visual jittering.
    </p>

    <div class="note-box">
        <p><em><strong>Note:</strong> This is a foundational tool for understanding the basics. This version does not yet implement soft bodies, complex rigid bodies, or ropes/cloth. Unlike my current work in progress one. </em></p>
    </div>

    <p>
        <strong>Recommended Reading:</strong><br>
        <em>"Game Physics Engine Development: How to Build a Robust Commercial-Grade Physics Engine For Your Game"</em> by Ian Millington.
    </p>

    <div class="image-block">
        <video controls autoplay muted loop>
            <source src="showcase/solver.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p class="caption">Test Sequence: PBD Constraint Stability</p>
    </div>
</article>
                `
            },
            'cagi': {
                title: "CAGI Implementation",
                content: `
                    <p>Under construction. Details regarding Cellular Automata Global Illumination.</p>
                    <div class="image-block">
                        <img src="showcase/cagi.png" alt="CAGI Grid">
                        <span class="caption">Visualization: Irradiance Propagation Map</span>
                    </div>
                `
            }
        };

        function loadContent() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const postBody = document.getElementById('postBody');
            const postTitle = document.getElementById('postTitle');

            if (id && projectLogs[id]) {
                postTitle.innerText = projectLogs[id].title;
                postBody.innerHTML = projectLogs[id].content;
            } else {
                postTitle.innerText = "Log Not Found";
                postBody.innerHTML = "<p>Please select a valid project from the main terminal.</p>";
            }
        }

        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('cyber-mode');
            toggle.innerText = document.body.classList.contains('cyber-mode') ? "MODE: FORMAL" : "MODE: CYBER";
        });

        window.onload = loadContent;
    </script>
</body>
</html>
